<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>THE DAILY REP</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#ecf3ff;background:#0b1220}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.45}header{padding:22px 18px 10px;max-width:1040px;margin:auto}header h1{margin:0;font-size:25px;letter-spacing:.09em}small,.muted{color:#98a9c2}.sub{font-size:13px;color:#a5b5cd}.shell{max-width:1040px;margin:auto;padding:10px 16px 95px}.nav{position:sticky;top:0;z-index:10;background:#0b1220ee;backdrop-filter:blur(10px);display:flex;overflow:auto;gap:6px;padding:10px 16px;border-bottom:1px solid #26354b}.nav button{background:transparent;color:#a7b9d2;padding:11px 14px;border-radius:11px;white-space:nowrap}.nav button.active{background:#243e60;color:white}.card{background:#162237;border:1px solid #2a3b53;border-radius:18px;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(120deg,#1e4264,#19253c)}h2{margin:0 0 12px;font-size:23px}h3{margin:0 0 10px;font-size:17px}p{line-height:1.5} .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.btn{background:#51c9ae;color:#071923;border-radius:10px;padding:11px 15px;font-weight:750}.btn.secondary{background:#293c57;color:#e8f0fc}.btn.danger{background:#6c3140;color:white}.btn.sm{padding:7px 10px;font-size:12px}.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:#28445c;color:#a9ebde;font-size:12px}.exercise{border-top:1px solid #314159;padding:15px 0}.exercise:first-child{border-top:0}.sets{display:grid;grid-template-columns:34px minmax(60px,1fr) minmax(60px,1fr) 70px 44px;gap:7px;align-items:center;margin:7px 0}.sets label{font-size:11px;color:#9cafc7}.sets input{width:100%;min-width:0}.sets input[type=checkbox]{width:21px;height:21px;accent-color:#51c9ae}input,select,textarea{background:#0e192b;border:1px solid #40516a;border-radius:9px;color:white;padding:10px;max-width:100%}textarea{width:100%;min-height:65px}input[type=number]{padding:9px 5px}.stat{font-size:28px;font-weight:800}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{min-height:57px;background:#1b2b43;color:white;border:1px solid #2e4058;border-radius:9px;padding:5px}.day.done{background:#1e5b53;border-color:#51c9ae}.day.today{outline:2px solid #e5bd69}.day.selected{box-shadow:inset 0 0 0 2px #85b4ff}.day span{display:block;font-size:10px;color:#b4c3d9;margin-top:4px}.weekday{text-align:center;color:#92a7c1;font-size:12px}.timer{font-size:clamp(58px,14vw,100px);font-variant-numeric:tabular-nums;text-align:center;font-weight:850;margin:18px}.phase{text-align:center;letter-spacing:.15em;color:#56d8bb;font-weight:750}.progress{height:9px;border-radius:9px;background:#33445d;overflow:hidden}.progress>div{height:100%;background:#51c9ae}.chart{width:100%;height:180px}.chart polyline{fill:none;stroke:#51c9ae;stroke-width:3}.chart circle{fill:#51c9ae}.hidden{display:none!important}a{color:#70ddc5}.note{border-left:3px solid #e7bd70;padding-left:12px;color:#d6c9ad}footer{color:#8ea0ba;text-align:center;font-size:12px;padding:25px}@media(min-width:750px){.nav{justify-content:center}.shell{padding-top:22px}.sets{grid-template-columns:45px 110px 110px 85px 50px}}
</style></head><body><header><div class="row"><div><h1>THE DAILY REP <span style="color:#51c9ae">/</span></h1><div class="sub">Show up. Stack days. Get stronger.</div></div><span class="pill" id="todayLabel"></span></div></header>
<nav class="nav" id="nav"></nav><main class="shell" id="app"></main><footer>Private, offline-capable workout tracking • Data stays in this browser unless exported</footer>
<script>
(()=>{'use strict';
const KEY='dailyrep_v3', DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], tabs=['Today','Calendar','Progress','Timer','Program','Settings'];
const ex={
bench:['Flat Bench Press','Chest','3 × 6–10','Press from mid-chest with control. Keep shoulder blades stable.'],
incline:['Incline Dumbbell Press','Chest','3 × 8–12','Use a modest incline and controlled range.'],
fly:['Cable / Dumbbell Flye','Chest','2 × 12–15','Soft elbows; avoid overstretching the shoulder.'],
pulldown:['Lat Pulldown','Back','3 × 8–12','Drive elbows down, keep torso steady.'],
row:['Dumbbell Row','Back','3 × 8–12','Pull elbow toward hip without twisting.'],
ohp:['Overhead Press','Shoulders','3 × 8–10','Press smoothly without arching your lower back.'],
lateral:['Lateral Raise','Shoulders','2 × 12–15','Raise with control, avoid shrugging.'],
curl:['Biceps Curl','Arms','2 × 10–15','Keep upper arms quiet; no swinging.'],
triceps:['Triceps Pressdown','Arms','2 × 10–15','Extend elbows without moving shoulders.'],
squat:['Goblet / Back Squat','Legs','3 × 6–10','Brace, descend as mobility allows, stand tall.'],
rdl:['Romanian Deadlift','Posterior chain','3 × 8–10','Hinge at hips, keep load close to legs.'],
split:['Split Squat','Legs','3 × 10–12/leg','Lower vertically, maintain balance.'],
curlleg:['Leg Curl','Hamstrings','3 × 10–12','Controlled lift and return.'],
calf:['Calf Raise','Calves','3 × 12–15','Pause at top and lower fully.'],
carry:['Loaded Carry','Core','3 × 40 sec','Walk tall with steady breathing.'],
lunge:['Walking Lunge','Legs','3 × 10–12/leg','Keep front knee tracking comfortably.'],
plank:['Plank','Core','3 × 40 sec','Brace without sagging or holding breath.'],
pushup:['Push-up','Chest','3 × 8–12','Maintain a straight line, adjust incline as needed.'],
chestpress:['Neutral-Grip DB Press','Chest','3 × 8–12','Palms facing inward; use pain-free range.'],
cableRow:['Seated Cable Row','Back','3 × 8–12','Pull toward lower ribs; avoid rocking.'],
facepull:['Face Pull','Shoulders','2 × 12–15','Pull to face with elbows high if comfortable.'],
bike:['Cycling / Incline Walk','Conditioning','1 × 30 min','Conversational pace; low impact.']
};
const base={
1:['bench','incline','pulldown','row','fly','lateral','curl','triceps'],
2:['squat','rdl','split','curlleg','calf','carry'],
3:['bike'],
4:['chestpress','incline','cableRow','pulldown','facepull','lateral','curl','triceps'],
5:['squat','rdl','lunge','curlleg','calf','plank'],
0:[],6:[]};
const labels={0:'Recovery',1:'Upper A · Press',2:'Lower A · Strength',3:'Low-impact Conditioning',4:'Upper B · Variation',5:'Lower B · Strength',6:'Recovery'};
const parse=(id)=>{let s=ex[id][2],n=parseInt(s)||3,r=(s.split('×')[1]||'8–12').trim();return {n,r}};
const fresh=()=>({sessions:{},custom:structuredClone(base),settings:{work:20,rest:10,rounds:8,restSeconds:90,units:'lb',startOfWeek:1},bodyweights:[]});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{state=fresh()}
state.sessions ||= {};state.custom ||= structuredClone(base);state.settings={...fresh().settings,...(state.settings||{})};state.bodyweights ||= [];
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const dateKey=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromKey=(s)=>new Date(s+'T12:00:00');
let selected=dateKey(new Date()),tab='Today',month=new Date(),timer={running:false,remaining:20,round:1,phase:'WORK',end:0,interval:null};
const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const workout=(day)=>state.custom[day]||[];
function sessionFor(date){const day=fromKey(date).getDay();if(!state.sessions[date])state.sessions[date]={day,entries:{},notes:'',completed:false,started:Date.now()};return state.sessions[date]}
function entryFor(s,id){if(!s.entries[id]){let p=parse(id),prior=latest(id,s.started);s.entries[id]={sets:Array.from({length:p.n},(_,i)=>({weight:prior?.sets?.[i]?.weight??'',reps:'',done:false})),rpe:'',notes:''}}return s.entries[id]}
function latest(id,before=Infinity){return Object.values(state.sessions).filter(s=>s.started<before&&s.entries?.[id]&&s.entries[id].sets.some(x=>x.done)).sort((a,b)=>b.started-a.started)[0]?.entries[id]}
function count(s){return Object.values(s?.entries||{}).reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0)}
function volume(s){return Object.values(s?.entries||{}).reduce((a,e)=>a+e.sets.reduce((b,x)=>b+(x.done?(Number(x.weight)||0)*(Number(x.reps)||0):0),0),0)}
function btn(label,fn,kind='secondary'){return `<button class="btn ${kind}" data-act="${fn}">${label}</button>`}
function render(){const today=dateKey(new Date());$('todayLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});$('nav').innerHTML=tabs.map(t=>`<button data-tab="${t}" class="${tab===t?'active':''}">${t}</button>`).join('');$('app').innerHTML=({Today:renderToday,Calendar:renderCalendar,Progress:renderProgress,Timer:renderTimer,Program:renderProgram,Settings:renderSettings})[tab]();bind();if(tab==='Timer')paintTimer()}
function renderToday(){let day=fromKey(selected).getDay(),ids=workout(day),s=state.sessions[selected],done=count(s),total=ids.reduce((a,id)=>a+(s?.entries[id]?.sets.length||parse(id).n),0);
return `<section class="card hero"><div class="row"><div><div class="sub">${selected===dateKey(new Date())?'TODAY’S SESSION':'SELECTED SESSION'} · ${escape(selected)}</div><h2>${labels[day]}</h2><span class="pill">${ids.length?ids.length+' exercises':'Recovery day'}</span> <span class="pill">${done}/${total} sets logged</span></div><input type="date" id="sessionDate" value="${selected}"></div><p class="sub">Aim for 2–3 reps in reserve. Stop short of failure and prioritize comfortable technique.</p><div class="progress"><div style="width:${total?Math.min(100,100*done/total):0}%"></div></div></section>
${!ids.length?`<section class="card"><h3>Recovery is part of the plan</h3><p>Rest, walk gently if you like, and prepare for the next session.</p>${btn('Mark recovery complete','complete','')}</section>`:`
<div class="row" style="margin-bottom:12px"><h2 style="margin:0">Workout log</h2>${btn('Start warm-up timer','goTimer')}</div>
${ids.map((id,i)=>exerciseCard(id,i,s)).join('')}
<section class="card"><h3>Session notes</h3><textarea id="sessionNotes" placeholder="Energy, modifications, discomfort, how it felt...">${escape(s?.notes||'')}</textarea><div class="row" style="margin-top:12px">${btn(s?.completed?'✓ Completed · tap to reopen':'Finish workout','complete',s?.completed?'secondary':'')}${btn('Rest timer','restTimer')}</div></section>`}`}
function exerciseCard(id,i,s){let meta=ex[id],e=s?.entries[id],sets=e?.sets||Array.from({length:parse(id).n},()=>({weight:'',reps:'',done:false})),prev=latest(id,s?.started||Infinity);return `<section class="card"><div class="row"><div><span class="pill">${i+1} · ${meta[1]}</span><h3 style="margin-top:9px">${meta[0]}</h3><div class="sub">${meta[2]} · ${escape(meta[3])}</div></div><div>${btn('Swap','swap:'+i,'secondary')}</div></div><p class="sub">Previous: ${prev?prev.sets.filter(x=>x.done).map(x=>`${x.weight||'BW'} × ${x.reps}`).join(' · ')||'No completed sets':'First time'} · ${state.settings.units}</p><div class="sets"><label>SET</label><label>WEIGHT</label><label>REPS / SEC</label><label>REST</label><label>DONE</label></div>${sets.map((x,j)=>`<div class="sets"><b>${j+1}</b><input aria-label="Weight" type="number" min="0" step="0.5" data-set="${id}:${j}:weight" value="${escape(x.weight)}" placeholder="0"><input aria-label="Reps" type="number" min="0" step="1" data-set="${id}:${j}:reps" value="${escape(x.reps)}" placeholder="${parse(id).r.split('–')[0]}"><button class="btn sm secondary" data-act="restTimer">▶</button><input aria-label="Set completed" type="checkbox" data-check="${id}:${j}" ${x.done?'checked':''}></div>`).join('')}<div class="row" style="margin-top:10px">${btn('+ Set','add:'+id)}${sets.length>1?btn('− Set','remove:'+id):''}</div></section>`}
function renderCalendar(){let y=month.getFullYear(),m=month.getMonth(),first=(new Date(y,m,1).getDay()-state.settings.startOfWeek+7)%7,last=new Date(y,m+1,0).getDate(),days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];return `<section class="card"><div class="row">${btn('‹','prevMonth')}<h2>${month.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2>${btn('›','nextMonth')}</div><div class="calendar">${Array.from({length:7},(_,i)=>`<div class="weekday">${days[(i+state.settings.startOfWeek)%7]}</div>`).join('')}${Array.from({length:first},()=>'<div></div>').join('')}${Array.from({length:last},(_,i)=>{let d=dateKey(new Date(y,m,i+1)),s=state.sessions[d];return `<button class="day ${s?.completed?'done':''} ${d===dateKey(new Date())?'today':''} ${d===selected?'selected':''}" data-date="${d}">${i+1}<span>${s?.completed?'✓ '+count(s)+' sets':count(s)?count(s)+' sets':labels[new Date(y,m,i+1).getDay()].split(' ')[0]}</span></button>`}).join('')}</div><p class="sub">Green = completed · gold outline = today. Tap any date to open or edit that session.</p></section><section class="card"><h3>Session on ${selected}</h3><p>${escape(labels[fromKey(selected).getDay()])} · ${state.sessions[selected]?.completed?'Completed':count(state.sessions[selected])?'In progress':'Not started'} · ${count(state.sessions[selected])} sets</p>${btn('Open workout','goToday')}</section>`}
function renderProgress(){let all=Object.entries(state.sessions).filter(([d,s])=>s.completed).sort((a,b)=>a[0].localeCompare(b[0])),thisMonth=all.filter(([d])=>d.slice(0,7)===dateKey(new Date()).slice(0,7));let ids=Object.keys(ex);return `<div class="grid"><div class="card"><div class="sub">COMPLETED SESSIONS</div><div class="stat">${all.length}</div></div><div class="card"><div class="sub">THIS MONTH</div><div class="stat">${thisMonth.length}</div></div><div class="card"><div class="sub">TOTAL SETS</div><div class="stat">${all.reduce((a,[,s])=>a+count(s),0)}</div></div><div class="card"><div class="sub">TOTAL LOGGED VOLUME</div><div class="stat">${Math.round(all.reduce((a,[,s])=>a+volume(s),0)).toLocaleString()}</div><small>${state.settings.units} × reps (excludes bodyweight)</small></div></div><section class="card"><h3>Exercise progression</h3><select id="chartExercise">${ids.map(id=>`<option value="${id}" ${id===chartId?'selected':''}>${ex[id][0]}</option>`).join('')}</select><div id="chartArea">${makeChart(chartId)}</div></section><section class="card"><h3>Recent completed workouts</h3>${all.length?all.slice(-12).reverse().map(([d,s])=>`<div class="row exercise"><div><b>${d}</b><div class="sub">${labels[s.day]} · ${count(s)} sets · ${Math.round(volume(s))} volume</div></div>${btn('View','view:'+d)}</div>`).join(''):'<p class="muted">Complete a workout to see your history here.</p>'}</section>`}
let chartId='bench';
function makeChart(id){let points=Object.entries(state.sessions).sort((a,b)=>a[0].localeCompare(b[0])).map(([d,s])=>({d,w:Math.max(0,...(s.entries?.[id]?.sets||[]).filter(x=>x.done).map(x=>Number(x.weight)||0))})).filter(x=>x.w>0);if(!points.length)return '<p class="muted">No completed weighted sets for this exercise yet.</p>';let max=Math.max(...points.map(x=>x.w),1),coords=points.map((p,i)=>({x:24+(i*(552/Math.max(1,points.length-1))),y:155-p.w/max*130,...p}));return `<svg class="chart" viewBox="0 0 600 180" preserveAspectRatio="none" aria-label="Exercise weight progression"><line x1="20" y1="155" x2="580" y2="155" stroke="#60728c"/><polyline points="${coords.map(p=>p.x+','+p.y).join(' ')}"/>${coords.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4"><title>${p.d}: ${p.w} ${state.settings.units}</title></circle>`).join('')}</svg><div class="sub">First: ${points[0].w} ${state.settings.units} · Latest: ${points.at(-1).w} ${state.settings.units} · Best: ${max} ${state.settings.units}</div>`}
function renderTimer(){let c=state.settings;return `<section class="card hero"><h2>Tabata warm-up</h2><p class="sub">Custom work / rest intervals and rounds. Timer runs while this tab is open; keep your phone awake.</p><div class="phase" id="phase"></div><div class="timer" id="clock"></div><div class="phase" id="round"></div><div class="row" style="justify-content:center;margin:20px">${btn(timer.running?'Pause':'Start','toggleTimer','')}${btn('Reset','resetTimer')}</div><div class="grid"><label>Work (sec)<input id="work" type="number" min="5" max="600" value="${c.work}"></label><label>Rest (sec)<input id="rest" type="number" min="0" max="600" value="${c.rest}"></label><label>Rounds<input id="rounds" type="number" min="1" max="99" value="${c.rounds}"></label></div></section><section class="card"><h3>Strength set rest</h3><div class="row"><label>Seconds <input id="restSeconds" type="number" min="10" max="900" value="${c.restSeconds}"></label>${btn('Start rest countdown','startRest')}</div><p class="sub">An audible cue plays at interval changes when supported by your browser.</p></section>`}
function renderProgram(){return `<section class="card hero"><h2>5-day training split</h2><p>Four resistance days, one low-impact conditioning day, two recovery days. Use 2–3 reps in reserve and increase load gradually after completing the top end of the rep range with good form.</p><p class="note">The source describes a split and exercise menu, not an exact authenticated A/B workout prescription. This app organizes that menu into practical sessions you can customize.</p></section>${[1,2,3,4,5,6,0].map(d=>`<section class="card"><div class="row"><h3>${DAYS[d]} · ${labels[d]}</h3><span class="pill">${workout(d).length} exercises</span></div>${workout(d).map((id,i)=>`<div class="row exercise"><div><b>${ex[id][0]}</b><div class="sub">${ex[id][2]} · ${ex[id][1]}</div></div>${btn('Replace','programSwap:'+d+':'+i)}</div>`).join('')}${btn('+ Add exercise','programAdd:'+d)} ${btn('Restore day','restore:'+d)}</section>`).join('')}<section class="card"><h3>Original source</h3><a target="_blank" rel="noopener" href="https://app.routines.club/blogs/workouts/matt-damon-workout-routine">Read the Matt Damon routine article ↗</a></section>`}
function renderSettings(){let c=state.settings;return `<section class="card"><h2>Preferences</h2><label>Weight unit <select id="units"><option ${c.units==='lb'?'selected':''}>lb</option><option ${c.units==='kg'?'selected':''}>kg</option></select></label><p class="sub">Changing units changes labels only; it does not convert existing entries.</p><label>Calendar starts on <select id="weekstart"><option value="0" ${c.startOfWeek===0?'selected':''}>Sunday</option><option value="1" ${c.startOfWeek===1?'selected':''}>Monday</option></select></label></section><section class="card"><h2>Backup & restore</h2><p class="sub">This app saves in browser localStorage. Clearing Safari site data or switching devices can erase it. Export backups regularly.</p>${btn('Export JSON backup','export','')} <label class="btn secondary" style="display:inline-block">Import JSON<input type="file" id="importFile" accept="application/json" hidden></label></section><section class="card"><h2>Reset</h2><p class="sub">Restore the program without deleting training history, or permanently delete all local data.</p>${btn('Reset program','resetProgram')} ${btn('Erase all app data','erase','danger')}</section>`}
function bind(){
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act));
document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;tab='Today';render()});
if($('sessionDate'))$('sessionDate').onchange=e=>{selected=e.target.value;render()};
if($('sessionNotes'))$('sessionNotes').oninput=e=>{sessionFor(selected).notes=e.target.value;save()};
document.querySelectorAll('[data-set]').forEach(el=>el.onchange=e=>{let [id,j,k]=e.target.dataset.set.split(':'),s=sessionFor(selected),entry=entryFor(s,id);entry.sets[+j][k]=e.target.value;save()});
document.querySelectorAll('[data-check]').forEach(el=>el.onchange=e=>{let [id,j]=e.target.dataset.check.split(':'),s=sessionFor(selected),entry=entryFor(s,id);entry.sets[+j].done=e.target.checked;save();render()});
if($('chartExercise'))$('chartExercise').onchange=e=>{chartId=e.target.value;$('chartArea').innerHTML=makeChart(chartId)};
for(let k of ['work','rest','rounds','restSeconds'])if($(k))$(k).onchange=e=>{state.settings[k]=Math.max(k==='rest'?0:1,Number(e.target.value)||1);save();if(!timer.running)resetTimer(false)};
if($('units'))$('units').onchange=e=>{state.settings.units=e.target.value;save();render()};
if($('weekstart'))$('weekstart').onchange=e=>{state.settings.startOfWeek=+e.target.value;save();render()};
if($('importFile'))$('importFile').onchange=importBackup;
}
function action(a){let s;if(a==='goTimer'){tab='Timer';render()}else if(a==='goToday'){tab='Today';render()}else if(a==='complete'){s=sessionFor(selected);s.completed=!s.completed;save();render()}else if(a.startsWith('add:')){let id=a.split(':')[1];entryFor(sessionFor(selected),id).sets.push({weight:'',reps:'',done:false});save();render()}else if(a.startsWith('remove:')){let id=a.split(':')[1];entryFor(sessionFor(selected),id).sets.pop();save();render()}else if(a.startsWith('swap:')||a.startsWith('programSwap:')||a.startsWith('programAdd:')){let parts=a.split(':'),d=parts[0]==='swap'?fromKey(selected).getDay():+parts[1],i=parts[0]==='swap'?+parts[1]:+parts[2];let choices=Object.keys(ex).map((id,n)=>`${n+1}. ${ex[id][0]}`).join('\n');let choice=prompt('Enter an exercise number:\n'+choices);if(choice===null)return;let id=Object.keys(ex)[Number(choice)-1];if(!id)return alert('Invalid exercise number');if(parts[0]==='programAdd')state.custom[d].push(id);else state.custom[d][i]=id;save();render()}else if(a.startsWith('restore:')){let d=+a.split(':')[1];state.custom[d]=[...base[d]];save();render()}else if(a==='prevMonth'||a==='nextMonth'){month=new Date(month.getFullYear(),month.getMonth()+(a==='nextMonth'?1:-1),1);render()}else if(a.startsWith('view:')){selected=a.split(':')[1];tab='Today';render()}else if(a==='toggleTimer')toggleTimer();else if(a==='resetTimer')resetTimer();else if(a==='startRest'||a==='restTimer'){timer.phase='REST';timer.round=1;timer.remaining=state.settings.restSeconds;timer.mode='single';timer.running=false;tab='Timer';render();startTimer()}else if(a==='export'){let blob=new Blob([JSON.stringify({app:'THE DAILY REP',version:3,exported:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='daily-rep-backup-'+dateKey(new Date())+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(a==='resetProgram'){if(confirm('Restore original workout schedule?')){state.custom=structuredClone(base);save();render()}}else if(a==='erase'){if(confirm('Permanently delete ALL workout history and settings?')){state=fresh();save();render()}}}
async function importBackup(e){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text()),data=x.data||x;if(!data.sessions||!data.custom||!data.settings)throw Error('Invalid backup structure');if(!confirm('Replace all existing app data with this backup?'))return;state={...fresh(),...data};save();render();alert('Backup restored')}catch(err){alert('Could not import backup: '+err.message)}}
function beep(){try{let C=window.AudioContext||window.webkitAudioContext,ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=780;g.gain.value=.08;o.start();o.stop(ctx.currentTime+.12);o.onended=()=>ctx.close()}catch{}}
function resetTimer(draw=true){clearInterval(timer.interval);timer={running:false,remaining:state.settings.work,round:1,phase:'WORK',mode:'tabata',end:0,interval:null};if(draw&&tab==='Timer')render();else paintTimer()}
function paintTimer(){if(!$('clock'))return;$('clock').textContent=`${Math.floor(timer.remaining/60).toString().padStart(2,'0')}:${Math.ceil(timer.remaining%60).toString().padStart(2,'0')}`;$('phase').textContent=timer.phase;$('round').textContent=timer.mode==='single'?'Set rest':`Round ${timer.round} / ${state.settings.rounds}`;let b=document.querySelector('[data-act="toggleTimer"]');if(b)b.textContent=timer.running?'Pause':'Start'}
function startTimer(){if(timer.running)return;timer.running=true;timer.end=Date.now()+timer.remaining*1000;clearInterval(timer.interval);timer.interval=setInterval(tick,100);paintTimer()}
function tick(){if(!timer.running)return;let r=Math.max(0,(timer.end-Date.now())/1000);timer.remaining=r;if(r<=0){beep();if(timer.mode==='single'){timer.running=false;clearInterval(timer.interval);timer.phase='DONE';timer.remaining=0}else if(timer.phase==='WORK'&&state.settings.rest>0){timer.phase='REST';timer.remaining=state.settings.rest;timer.end=Date.now()+timer.remaining*1000}else if(timer.round>=state.settings.rounds){timer.running=false;clearInterval(timer.interval);timer.phase='DONE';timer.remaining=0}else{timer.round++;timer.phase='WORK';timer.remaining=state.settings.work;timer.end=Date.now()+timer.remaining*1000}}paintTimer()}
function toggleTimer(){if(timer.running){timer.remaining=Math.max(0,(timer.end-Date.now())/1000);timer.running=false;clearInterval(timer.interval)}else{if(timer.phase==='DONE')resetTimer(false);startTimer()}paintTimer()}
render();})();
</script></body></html>
