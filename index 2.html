<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>THE DAILY REP</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#eef2f9;background:#0b1120}*{box-sizing:border-box}body{margin:0}header{padding:25px 18px;background:#111b2d;border-bottom:1px solid #29364b}h1{margin:0;font-size:25px;letter-spacing:2px}small,.muted{color:#9aaac2}nav{display:flex;overflow:auto;gap:7px;padding:12px;background:#111b2d;position:sticky;top:0;z-index:5}button{cursor:pointer;background:#24344c;border:1px solid #3a4d68;border-radius:10px;color:#f5f7fc;padding:11px 14px;font-weight:650}button.active,.primary{background:#67d6ac;color:#09251c;border-color:#67d6ac}main{max-width:900px;margin:auto;padding:16px 16px 90px}.panel{background:#162238;border:1px solid #2a3a53;border-radius:16px;padding:17px;margin:12px 0}h2{font-size:22px;margin:5px 0 12px}h3{margin:4px 0 10px}.tag{display:inline-block;background:#2a3e55;color:#c6e6ff;border-radius:20px;padding:5px 10px;font-size:12px;margin-bottom:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{min-height:55px;padding:7px 2px;text-align:center;font-size:13px;border-radius:9px}.done{background:#235947!important;border-color:#49ae85!important}.selected{outline:2px solid #67d6ac}.today{color:#67d6ac}input,select,textarea{background:#0d1729;border:1px solid #40506a;border-radius:8px;color:white;padding:10px;min-width:0}input[type=number]{width:77px}.set{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}.set label{font-size:13px;color:#b3c3d6}.exercise{border-top:1px solid #344159;padding:15px 0}.exercise:first-child{border:0}.tabs{display:none}.tabs.active{display:block}.timer{font-size:64px;font-variant-numeric:tabular-nums;text-align:center;font-weight:800;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#22334a;border-radius:10px;padding:12px;text-align:center}.stat strong{display:block;font-size:23px;color:#67d6ac}.hint{font-size:13px;color:#a8bad0;line-height:1.5}.wide{width:100%;margin-top:12px}.mini{padding:6px 9px;font-size:12px}.empty{color:#9aaac2;padding:15px 0}a{color:#84dfbf}textarea{width:100%;min-height:70px} @media(max-width:420px){.stats{grid-template-columns:repeat(3,1fr)}.stat strong{font-size:18px}.timer{font-size:52px}}</style></head><body><header><div class="row"><div><h1>THE DAILY REP</h1><small>Show up. Stack days. Get 1% better.</small></div><span class="tag">LEAN + STRONG</span></div></header><nav id="nav"></nav><main><section id="home" class="tabs active"></section><section id="workout" class="tabs"></section><section id="calendar" class="tabs"></section><section id="timer" class="tabs"></section><section id="progress" class="tabs"></section><section id="guide" class="tabs"></section></main><script>
const PROGRAM=[{name:'Upper Body A',focus:'Chest-led strength',ex:[['Flat dumbbell or barbell bench press',3,'6–10','90–120 sec'],['Cable lat pulldown',3,'8–12','75–90 sec'],['Incline dumbbell press',3,'8–12','90 sec'],['Dumbbell or barbell row',3,'8–12','90 sec'],['Lateral raise',2,'12–15','60 sec'],['Biceps curl',2,'10–15','60 sec']]},{name:'Lower Body A',focus:'Squat emphasis',ex:[['Back squat or goblet squat',3,'6–10','120 sec'],['Romanian deadlift',3,'8–10','90 sec'],['Split squat',3,'10–12 / leg','75 sec'],['Leg curl',2,'10–12','60 sec'],['Calf raise',3,'12–15','60 sec'],['Plank',3,'30–60 sec','60 sec']]},{name:'Conditioning',focus:'Low-impact cardio',ex:[['Incline treadmill walk, bike, rower or VersaClimber',1,'20–35 min','Easy-moderate pace']]},{name:'Upper Body B',focus:'Angles + shoulders',ex:[['Incline dumbbell press',3,'8–12','90 sec'],['Dumbbell or barbell row',3,'8–12','90 sec'],['Overhead press',3,'8–10','90 sec'],['Cable or dumbbell flye',2,'12–15','60 sec'],['Cable lat pulldown',3,'8–12','75 sec'],['Triceps extension',2,'10–15','60 sec']]},{name:'Lower Body B',focus:'Hinge + single-leg',ex:[['Romanian deadlift',3,'8–10','120 sec'],['Goblet squat',3,'6–10','90 sec'],['Walking lunge',3,'10–12 / leg','75 sec'],['Leg curl or Nordic curl',2,'10–12','75 sec'],['Calf raise',3,'12–15','60 sec'],['Loaded carry',3,'30–45 sec','60 sec']]},{name:'Recovery',focus:'Full rest',ex:[]},{name:'Recovery',focus:'Full rest',ex:[]}];
const $=id=>document.getElementById(id),key=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`},today=()=>key(new Date()),idx=d=>(new Date(d+'T12:00:00').getDay()+6)%7;let selected=today(),view=new Date(),db={};try{db=JSON.parse(localStorage.getItem('dailyRepV1')||'{}')}catch{};let draft={};const save=()=>localStorage.setItem('dailyRepV1',JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tab(t){document.querySelectorAll('.tabs').forEach(e=>e.classList.toggle('active',e.id===t));document.querySelectorAll('nav button').forEach(e=>e.classList.toggle('active',e.dataset.tab===t));if(t==='workout')renderWorkout();if(t==='calendar')renderCalendar();if(t==='progress')renderProgress();if(t==='home')renderHome()}const tabs=[['home','Today'],['workout','Log workout'],['calendar','Calendar'],['timer','Tabata'],['progress','Progress'],['guide','Guide']];$('nav').innerHTML=tabs.map(([id,n])=>`<button data-tab="${id}" onclick="tab('${id}')">${n}</button>`).join('');
function entry(d){return db[d]||{}}function renderHome(){let p=PROGRAM[idx(today())],completed=Object.values(db).filter(x=>x.done).length,week=Object.keys(db).filter(d=>db[d].done&&((new Date(today())-new Date(d))/86400000)<7).length;$('home').innerHTML=`<div class="panel"><span class="tag">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</span><h2>${p.name}</h2><p class="muted">${p.focus}</p><p>${p.ex.length?p.ex.length+' exercises • 2–3 reps in reserve':'Full rest day — recovery is part of the program.'}</p><button class="primary" onclick="selected=today();tab('workout')">${p.ex.length?'Start today’s workout':'Open today’s log'} →</button></div><div class="stats"><div class="stat"><strong>${completed}</strong><small>Sessions logged</small></div><div class="stat"><strong>${week}</strong><small>Last 7 days</small></div><div class="stat"><strong>${Object.keys(db).length}</strong><small>Days recorded</small></div></div><div class="panel"><h3>This week's plan</h3>${PROGRAM.map((x,i)=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #293a50"><span>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</span><strong>${x.name}</strong></div>`).join('')}</div>`}
function lastWeight(name){return Object.keys(db).sort().reverse().flatMap(d=>db[d].exercises||[]).filter(e=>e.name===name).flatMap(e=>e.sets||[]).find(s=>s.weight!==''&&s.weight!=null)?.weight??''}function renderWorkout(){let p=PROGRAM[idx(selected)],stored=entry(selected);draft=JSON.parse(JSON.stringify(stored.exercises||p.ex.map(([name,sets])=>({name,sets:Array.from({length:sets},()=>({weight:lastWeight(name),reps:'',done:false}))}))));$('workout').innerHTML=`<div class="panel"><div class="row"><h2>${p.name}</h2><input type="date" id="logdate" value="${selected}" onchange="selected=this.value;renderWorkout()"></div><p class="muted">${p.focus} • Aim for 2–3 reps in reserve; no grinding.</p>${p.ex.length?p.ex.map(([name,n,reps,rest],i)=>`<div class="exercise"><h3>${esc(name)}</h3><p class="hint">${n} sets · ${reps} reps · Rest ${rest}<br>Last recorded weight: ${esc(lastWeight(name)||'—')} lb</p>${draft[i].sets.map((s,j)=>`<div class="set"><label>Set ${j+1}</label><input aria-label="Weight pounds" type="number" min="0" step="0.5" placeholder="lb" value="${esc(s.weight)}" oninput="draft[${i}].sets[${j}].weight=this.value"><input aria-label="Repetitions" type="number" min="0" placeholder="reps" value="${esc(s.reps)}" oninput="draft[${i}].sets[${j}].reps=this.value"><label><input type="checkbox" ${s.done?'checked':''} onchange="draft[${i}].sets[${j}].done=this.checked"> Done</label></div>`).join('')}</div>`).join(''):'<p>Rest and recover. You can record a recovery day below.</p>'}<label class="hint">Notes</label><textarea id="notes" placeholder="How did it feel? Any modifications?">${esc(stored.notes||'')}</textarea><button class="wide" onclick="saveLog(false)">Save progress</button><button class="primary wide" onclick="saveLog(true)">✓ Mark day complete</button>${stored.done?'<p class="tag">Previously completed ✓</p>':''}</div>`}function saveLog(done){db[selected]={exercises:draft,notes:$('notes').value,done:done||!!entry(selected).done,updated:new Date().toISOString(),name:PROGRAM[idx(selected)].name};save();renderWorkout();alert(done?'Workout completed and saved!':'Progress saved!')}
function renderCalendar(){let y=view.getFullYear(),m=view.getMonth(),start=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells=Array(start).fill('').concat(Array.from({length:days},(_,i)=>i+1));$('calendar').innerHTML=`<div class="panel"><div class="row"><button onclick="view.setMonth(view.getMonth()-1);renderCalendar()">←</button><h2>${view.toLocaleString(undefined,{month:'long',year:'numeric'})}</h2><button onclick="view.setMonth(view.getMonth()+1);renderCalendar()">→</button></div><div class="grid">${['M','T','W','T','F','S','S'].map(x=>`<div class="hint" style="text-align:center">${x}</div>`).join('')}${cells.map(n=>{if(!n)return '<div></div>';let d=key(new Date(y,m,n));return `<button class="day ${entry(d).done?'done':''} ${d===selected?'selected':''} ${d===today()?'today':''}" onclick="selected='${d}';tab('workout')">${n}${entry(d).done?' ✓':''}</button>`}).join('')}</div><p class="hint">Green = completed. Tap any date to review or edit its workout log.</p></div>`}
function renderProgress(){let logs=Object.entries(db).filter(([d,e])=>e.done).sort((a,b)=>b[0].localeCompare(a[0])),records={};Object.entries(db).forEach(([d,e])=>(e.exercises||[]).forEach(ex=>(ex.sets||[]).forEach(s=>{let w=Number(s.weight);if(s.done&&w>0){let old=records[ex.name];if(!old||w>old.weight)records[ex.name]={weight:w,date:d}}})));$('progress').innerHTML=`<div class="panel"><h2>Personal bests</h2>${Object.entries(records).length?Object.entries(records).sort().map(([n,r])=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #344159"><span>${esc(n)}</span><strong>${r.weight} lb</strong></div>`).join(''):'<p class="empty">Log completed sets with weights to see your records.</p>'}</div><div class="panel"><h2>Workout history</h2>${logs.length?logs.map(([d,e])=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #344159"><div><strong>${d}</strong><div class="hint">${esc(e.name||PROGRAM[idx(d)].name)}</div></div><button class="mini" onclick="selected='${d}';tab('workout')">View</button></div>`).join(''):'<p class="empty">No completed workouts yet.</p>'}</div><div class="panel"><h3>Backup your data</h3><p class="hint">Records are stored on this browser/device, not in a cloud account. Export a backup regularly, especially before clearing browser data.</p><button onclick="exportData()">Export JSON backup</button> <label class="hint">Import backup <input type="file" accept="application/json" onchange="importData(this.files[0])"></label></div>`}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='daily-rep-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(file){if(!file)return;try{let x=JSON.parse(await file.text());if(!x||typeof x!=='object'||Array.isArray(x))throw Error();if(confirm('Replace your current workout data with this backup?')){db=x;save();renderProgress()}}catch{alert('Invalid backup file')}}
let interval=null,remaining=20,phase='work',round=1,running=false;function timerSettings(){return {work:Math.max(1,+$('tw').value||20),rest:Math.max(1,+$('tr').value||10),rounds:Math.max(1,+$('tn').value||8)}}function timerRender(){let s=timerSettings();$('clock').textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;$('phase').textContent=`${phase.toUpperCase()} • Round ${round} / ${s.rounds}`;$('toggle').textContent=running?'Pause':'Start'}function beep(){try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=800;g.gain.value=.08;o.start();o.stop(c.currentTime+.13);o.onended=()=>c.close()}catch{}}function resetTimer(){clearInterval(interval);interval=null;running=false;phase='work';round=1;remaining=timerSettings().work;timerRender()}function toggleTimer(){if(running){clearInterval(interval);running=false;timerRender();return}running=true;interval=setInterval(()=>{remaining--;if(remaining<=0){beep();let s=timerSettings();if(phase==='work'){if(round===s.rounds){clearInterval(interval);running=false;remaining=0;$('phase').textContent='COMPLETE ✓';$('clock').textContent='0:00';$('toggle').textContent='Start';return}phase='rest';remaining=s.rest}else{phase='work';round++;remaining=s.work}}timerRender()},1000);timerRender()}$('timer').innerHTML=`<div class="panel"><h2>Tabata warm-up</h2><p class="hint">Default: 20 sec work / 10 sec rest × 8 rounds (4 minutes). Adjust to your preference.</p><div class="row"><label>Work (sec)<br><input id="tw" type="number" min="1" value="20" onchange="resetTimer()"></label><label>Rest (sec)<br><input id="tr" type="number" min="1" value="10" onchange="resetTimer()"></label><label>Rounds<br><input id="tn" type="number" min="1" value="8" onchange="resetTimer()"></label></div><div class="timer" id="clock">0:20</div><p id="phase" style="text-align:center">WORK • Round 1 / 8</p><div class="row" style="justify-content:center"><button class="primary" id="toggle" onclick="toggleTimer()">Start</button><button onclick="resetTimer()">Reset</button></div><p class="hint">Keep the screen awake while using this browser timer. Audio may require an initial tap and may be limited by iOS.</p></div>`;
$('guide').innerHTML=`<div class="panel"><h2>Training philosophy</h2><p>The source describes a four-day strength split with midweek low-impact conditioning and two rest days. Aim for <strong>2–3 repetitions in reserve</strong> on working sets, and progress gradually when you can comfortably complete the top of a rep range.</p><p class="hint">This app organizes the article into A/B sessions for practical logging; the exact A/B exercise selection and rest intervals are app programming choices, not a verified personal training log of Matt Damon.</p></div><div class="panel"><h3>How to use</h3><p>Open Today → Log workout → record weight and reps for each set → mark complete. Tap Calendar to revisit a date. The Progress tab shows your highest recorded loads and history.</p><p>On conditioning day, record minutes in the reps field and leave weight blank. Use the Notes field to record distance or effort.</p></div><div class="panel"><h3>Safety and recovery</h3><p>Warm up with pain-free movements. Modify pressing or overhead work if your shoulder is irritated, and follow any clinician/PT restrictions. Stop exercises that cause sharp pain. The goal is sustainable training, not failure.</p><p class="hint">Source: <a href="https://app.routines.club/blogs/workouts/matt-damon-workout-routine" target="_blank" rel="noopener">Routines.club Matt Damon workout breakdown</a>. This is an independent personal-use tracker.</p></div>`;renderHome();resetTimer();
</script></body></html>
